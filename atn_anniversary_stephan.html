  /* ── Dark scrim so text stays readable ── */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(
      100deg,
      rgba(0,40,30,0.72) 0%,
      rgba(0,40,30,0.55) 45%,
      rgba(0,40,30,0.15) 100%
    );
  }

  /* ── Green color-block panel left side ── */
  .green-panel {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 52%;
    background: #00A77F;
    clip-path: polygon(0 0, 100% 0, 82% 100%, 0 100%);
    z-index: 2;
    opacity: 0.93;
  }

  /* ── All foreground content ── */
  .stage {
    position: absolute; inset: 0;
    z-index: 10;
    display: flex; flex-direction: column;
  }

  /* ── Top bar ── */
  .top-bar {
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 3.5vh 5vw 0;
  }
  .logo-img {
    height: clamp(28px, 4.2vh, 52px);
    width: auto;
    /* logo is ATN-green, on green panel we need white version */
    filter: brightness(0) invert(1);
    opacity: 0.92;
  }
  .top-right {
    text-align: right;
    font-size: clamp(8px, 0.95vw, 12px);
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    line-height: 1.8;
  }

  /* ── Green rule ── */
  .rule {
    height: 2px; background: rgba(255,255,255,0.35);
    margin: 1.8vh 5vw 0;
    width: 44%;
  }

  /* ── Main content ── */
  .main {
    flex: 1; display: flex; align-items: center;
    padding: 2vh 5vw;
    gap: 0;
  }

  .left {
    width: 44%;
    display: flex; flex-direction: column; justify-content: center;
  }

  .tag {
    display: inline-block;
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: clamp(7px, 0.82vw, 11px);
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 5px 14px;
    margin-bottom: 3.2vh;
    align-self: flex-start;
    animation: slideUp 0.7s ease both;
  }

  .name {
    font-size: clamp(32px, 6.8vw, 82px);
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 0.88;
    margin-bottom: 2.2vh;
    animation: slideUp 0.85s 0.1s ease both;
  }

  .decade {
    font-size: clamp(9px, 1.1vw, 14px);
    font-weight: 300;
    color: rgba(255,255,255,0.72);
    letter-spacing: 0.24em;
    text-transform: uppercase;
    margin-bottom: 4.5vh;
    animation: slideUp 0.95s 0.2s ease both;
  }

  .bfast {
    border-left: 3px solid rgba(255,255,255,0.55);
    padding-left: 16px;
    animation: slideUp 1.05s 0.3s ease both;
  }
  .bfast-label {
    font-size: clamp(7px, 0.88vw, 11px);
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    margin-bottom: 6px;
  }
  .bfast-desc {
    font-size: clamp(9px, 1.1vw, 14px);
    font-weight: 400;
    color: rgba(255,255,255,0.72);
    letter-spacing: 0.04em;
    line-height: 1.65;
  }

  /* ── 10-year badge — sits at the junction ── */
  .badge-wrap {
    position: absolute;
    left: 44%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    animation: pop 1s 0.35s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .badge {
    position: relative;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: clamp(110px, 13vw, 165px);
    height: clamp(110px, 13vw, 165px);
    border-radius: 50%;
    background: #fff;
    box-shadow:
      0 0 0 4px #00A77F,
      0 0 40px rgba(0,167,127,0.5),
      0 8px 32px rgba(0,0,0,0.35);
  }

  .ring-svg {
    position: absolute;
    width: 138%; height: 138%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: spin 18s linear infinite;
  }

  .badge-num {
    font-size: clamp(42px, 8vw, 96px);
    font-weight: 900;
    color: #00A77F;
    line-height: 0.85;
    letter-spacing: -0.03em;
  }
  .badge-yr {
    font-size: clamp(9px, 1.5vw, 18px);
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #006A4D;
    margin-top: 3px;
  }
  .badge-svc {
    font-size: clamp(6px, 0.7vw, 9px);
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #999;
    margin-top: 2px;
  }

  /* ── Bottom bar ── */
  .bot-rule {
    height: 1px; background: rgba(255,255,255,0.18);
    margin: 0 5vw 1.5vh;
    width: 44%;
  }
  .bot {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 5vw 2.8vh;
  }
  .tagline {
    font-size: clamp(7px, 0.8vw, 10px);
    font-weight: 300;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
  }
  .corp-badge {
    font-size: clamp(7px, 0.82vw, 10px);
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  /* ── Animations ── */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { opacity: 0; transform: translate(-50%,-50%) scale(0.4); }
    to   { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  }
  @keyframes spin {
    to { transform: translate(-50%,-50%) rotate(360deg); }
  }
</style>
</head>
<body>
<div class="sign">

  <!-- Duotoned robot photo background -->
  <div class="bg"></div>

  <!-- Dark gradient scrim for legibility -->
  <div class="scrim"></div>

  <!-- ATN green color-block panel -->
  <div class="green-panel"></div>

  <!-- All content -->
