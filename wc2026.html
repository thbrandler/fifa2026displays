<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>ATN · FIFA 2026 Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --atn-teal: #009f88;
    --atn-teal-bright: #00d4b3;
    --bg: #1a1a1a;
    --bg-elev: #222222;
    --bg-card: #2a2a2a;
    --bg-hero: #1f2a28;
    --text: #ffffff;
    --text-dim: #9a9a9a;
    --text-dimmer: #6a6a6a;
    --border: #333333;
    --live: #ff3b30;
    --gold: #f5c542;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --up: #4dd070;
    --down: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Mulish',sans-serif; overflow:hidden; }
  .viewport { position:fixed; inset:0; overflow:hidden; background:var(--bg); }
  .stage {
    position:absolute; top:0; left:0; width:1920px; height:1080px;
    transform-origin:top left; background:var(--bg);
    display:flex; flex-direction:column; padding:40px 52px 28px; overflow:hidden;
  }
  .stage::before {
    content:''; position:absolute; top:-30%; right:-15%; width:900px; height:900px;
    background:radial-gradient(circle, rgba(0,159,136,0.12) 0%, transparent 65%);
    pointer-events:none;
  }
  .stage::after {
    content:''; position:absolute; bottom:-30%; left:-15%; width:700px; height:700px;
    background:radial-gradient(circle, rgba(0,159,136,0.06) 0%, transparent 65%);
    pointer-events:none;
  }

  /* Header */
  header {
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px; border-bottom:2px solid var(--border);
    position:relative; z-index:1; flex-shrink:0;
  }
  .branding { display:flex; align-items:center; gap:18px; }
  .atn-mark { font-family:'Syne',sans-serif; font-weight:800; font-size:36px; letter-spacing:0.04em; color:var(--atn-teal); line-height:1; }
  .divider { width:2px; height:34px; background:var(--border); }
  .section-label { font-family:'Mulish',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.32em; color:var(--text-dim); text-transform:uppercase; }
  .title-block { text-align:right; }
  .title { font-family:'Syne',sans-serif; font-weight:800; font-size:52px; letter-spacing:0.02em; line-height:0.95; text-transform:uppercase; }
  .title .accent { color:var(--atn-teal-bright); }
  .subtitle { font-family:'Mulish',sans-serif; font-weight:600; font-size:14px; color:var(--text-dim); margin-top:8px; letter-spacing:0.18em; text-transform:uppercase; }

  /* Footer */
  footer {
    padding-top:14px; margin-top:10px; display:flex;
    align-items:center; justify-content:space-between;
    border-top:2px solid var(--border); position:relative; z-index:1; flex-shrink:0;
  }
  .footer-tag { font-family:'Syne',sans-serif; font-weight:700; font-size:14px; color:var(--text-dim); letter-spacing:0.22em; text-transform:uppercase; }
  .footer-meta { font-family:'Mulish',sans-serif; font-weight:700; font-size:11px; color:var(--text-dim); letter-spacing:0.2em; text-transform:uppercase; }

  /* Body grid: today + top 5 + shame zone */
  .body-grid {
    flex:1; display:grid; grid-template-columns: 1fr 1fr 1fr;
    gap:18px; margin-top:18px; min-height:0; position:relative; z-index:1;
  }

  /* ===== TODAY PANEL ===== */
  .today-panel, .leaderboard {
    background:var(--bg-elev); border:1px solid var(--border); border-radius:14px;
    padding:20px 20px 14px; display:flex; flex-direction:column; min-height:0; min-width:0;
  }
  .panel-header, .lb-header { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:12px; border-bottom:2px solid var(--border); margin-bottom:14px; flex-shrink:0; gap:12px; }
  .panel-title, .lb-title { font-family:'Syne',sans-serif; font-weight:800; font-size:20px; letter-spacing:0.18em; color:var(--atn-teal-bright); text-transform:uppercase; white-space:nowrap; }
  .panel-subtitle, .lb-subtitle { font-family:'Mulish',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.2em; color:var(--text-dim); text-transform:uppercase; text-align:right; white-space:nowrap; }
  .today-list { display:flex; flex-direction:column; gap:12px; flex:1; min-height:0; overflow:hidden; }
  .today-empty { font-family:'Mulish',sans-serif; font-weight:700; font-size:13px; color:var(--text-dimmer); text-align:center; margin-top:30px; letter-spacing:0.22em; text-transform:uppercase; }

  /* Today match cards — sized to fit ~6-8 matches comfortably */
  .tmatch { background:var(--bg-card); border-radius:11px; padding:14px 16px; border-left:4px solid var(--atn-teal); flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; }
  .tmatch.completed { opacity:0.6; border-left-color:var(--text-dimmer); }
  .tmatch.live { border-left-color:var(--live); background:linear-gradient(90deg, rgba(255,59,48,0.12), var(--bg-card)); box-shadow:0 0 0 1px rgba(255,59,48,0.3); }
  .tmatch-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .tmatch-group { font-family:'Syne',sans-serif; font-weight:700; font-size:12px; color:var(--atn-teal-bright); letter-spacing:0.2em; }
  .tmatch.live .tmatch-group { color:var(--live); }
  .tmatch-status { font-family:'Mulish',sans-serif; font-weight:800; font-size:13px; color:var(--text); letter-spacing:0.04em; display:flex; align-items:center; gap:6px; }
  .tmatch.completed .tmatch-status { color:var(--text-dim); }
  .tmatch.live .tmatch-status { color:var(--live); }
  .tmatch-teams { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .tteam { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .tteam.right { justify-content:flex-end; }
  .tflag { width:42px; height:28px; border-radius:3px; object-fit:cover; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.4); }
  .tflag.placeholder { background:var(--border); }
  .tcode { font-family:'Syne',sans-serif; font-weight:700; font-size:26px; color:var(--text); letter-spacing:0.04em; }
  .tcode.placeholder { font-size:14px; letter-spacing:0.04em; color:var(--text-dim); text-transform:uppercase; font-weight:700; }
  .tvs { font-family:'Mulish',sans-serif; font-weight:700; font-size:14px; color:var(--text-dimmer); letter-spacing:0.24em; }
  .tscore { font-family:'Syne',sans-serif; font-weight:800; font-size:30px; color:var(--text); letter-spacing:0.04em; }
  .tmatch.live .tscore { color:var(--live); }

  /* Shame zone variant */
  .leaderboard.shame .lb-title { color:var(--down); }
  .leaderboard.shame .lb-row { border-left-color:#5a3535; }
  .leaderboard.shame .lb-points { color:var(--down); opacity:0.85; }

  /* ===== WEEK VIEW (3-day) ===== */
  .days {
    display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
    flex:1; position:relative; min-height:0;
  }
  .day { background:var(--bg-elev); border-radius:14px; padding:22px 20px 18px; display:flex; flex-direction:column; border:1px solid var(--border); overflow:hidden; }
  .day.today { border-color:var(--atn-teal); box-shadow:0 0 0 1px var(--atn-teal); }
  .day-header { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid var(--border); margin-bottom:14px; }
  .day-name { font-family:'Syne',sans-serif; font-weight:800; font-size:28px; color:var(--atn-teal-bright); letter-spacing:0.06em; }
  .day-date { font-family:'Mulish',sans-serif; font-weight:700; font-size:14px; color:var(--text-dim); letter-spacing:0.14em; }
  .matches { display:flex; flex-direction:column; gap:12px; }
  .day-empty { font-family:'Mulish',sans-serif; font-weight:600; font-size:13px; color:var(--text-dimmer); text-align:center; margin-top:20px; letter-spacing:0.18em; text-transform:uppercase; }

  .match { background:var(--bg-card); border-radius:10px; padding:12px 16px 13px; border-left:4px solid var(--atn-teal); }
  .match.completed { opacity:0.65; border-left-color:var(--text-dimmer); }
  .match.live { border-left-color:var(--live); background:linear-gradient(90deg, rgba(255,59,48,0.10), var(--bg-card)); }
  .match-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .match-group { font-family:'Syne',sans-serif; font-weight:700; font-size:12px; color:var(--atn-teal-bright); letter-spacing:0.2em; }
  .match.live .match-group { color:var(--live); }
  .match-time, .match-status { font-family:'Mulish',sans-serif; font-weight:800; font-size:13px; color:var(--text); letter-spacing:0.04em; display:flex; align-items:center; gap:5px; }
  .match.completed .match-status { color:var(--text-dim); }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--live); animation:pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.25); } }
  .match-teams { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .team { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
  .team.right { justify-content:flex-end; }
  .flag { width:36px; height:24px; border-radius:3px; object-fit:cover; flex-shrink:0; box-shadow:0 1px 4px rgba(0,0,0,0.4); }
  .flag.placeholder { background:var(--border); }
  .code { font-family:'Syne',sans-serif; font-weight:700; font-size:22px; color:var(--text); letter-spacing:0.04em; }
  .code.placeholder { font-size:13px; letter-spacing:0.04em; color:var(--text-dim); text-transform:uppercase; font-weight:700; }
  .vs { font-family:'Mulish',sans-serif; font-weight:700; font-size:13px; color:var(--text-dimmer); letter-spacing:0.22em; }
  .score { font-family:'Syne',sans-serif; font-weight:800; font-size:26px; color:var(--text); letter-spacing:0.04em; }
  .match.live .score { color:var(--live); }

  /* ===== DAY VIEW ===== */
  .day-view { flex:1; display:flex; flex-direction:column; position:relative; min-height:0; }
  .hero-row { display:grid; gap:14px; flex:1; min-height:0; }
  .hero-row[data-count="1"] { grid-template-columns:1fr; }
  .hero-row[data-count="2"] { grid-template-columns:1fr 1fr; }
  .hero-row[data-count="3"] { grid-template-columns:1fr 1fr 1fr; }
  .hero { background:var(--bg-hero); border:1px solid var(--border); border-radius:16px; padding:30px 32px;
    display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden;
    background:radial-gradient(ellipse at center, rgba(0,159,136,0.08) 0%, var(--bg-elev) 70%); }
  .hero.live { border:2px solid var(--live); box-shadow:0 0 40px rgba(255,59,48,0.15); }
  .hero-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
  .hero-group { font-family:'Syne',sans-serif; font-weight:800; font-size:16px; color:var(--atn-teal-bright); letter-spacing:0.22em; }
  .hero.live .hero-group { color:var(--text); }
  .hero-status { font-family:'Mulish',sans-serif; font-weight:800; font-size:16px; letter-spacing:0.18em; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  .hero.live .hero-status { color:var(--live); }
  .live-dot-big { width:11px; height:11px; border-radius:50%; background:var(--live); animation:pulse 1.5s ease-in-out infinite; }
  .hero-teams { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:20px; }
  .hero-team { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .hero-flag { width:120px; height:86px; border-radius:6px; object-fit:cover; box-shadow:0 6px 24px rgba(0,0,0,0.5); }
  .hero-flag.placeholder { background:var(--border); }
  .hero-code { font-family:'Syne',sans-serif; font-weight:800; font-size:38px; color:var(--text); letter-spacing:0.04em; }
  .hero-code.placeholder { font-size:16px; color:var(--text-dim); text-align:center; letter-spacing:0.06em; }
  .hero-name { font-family:'Mulish',sans-serif; font-weight:700; font-size:13px; color:var(--text-dim); letter-spacing:0.12em; text-transform:uppercase; }
  .hero-score-block { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .hero-score { font-family:'Syne',sans-serif; font-weight:800; font-size:84px; color:var(--text); letter-spacing:0.02em; line-height:1; }
  .hero-vs { font-family:'Mulish',sans-serif; font-weight:800; font-size:20px; color:var(--text-dimmer); letter-spacing:0.3em; }
  .hero-time { font-family:'Syne',sans-serif; font-weight:800; font-size:54px; color:var(--atn-teal-bright); letter-spacing:0.04em; }

  .others-section { margin-top:14px; flex-shrink:0; }
  .others-label { font-family:'Mulish',sans-serif; font-weight:800; font-size:11px; color:var(--text-dim); letter-spacing:0.28em; text-transform:uppercase; margin-bottom:9px; }
  .others-row { display:grid; gap:10px; grid-auto-flow:column; grid-auto-columns:1fr; }
  .other-card { background:var(--bg-card); border-radius:10px; padding:10px 12px; border-left:3px solid var(--atn-teal); }
  .other-card.completed { opacity:0.65; border-left-color:var(--text-dimmer); }
  .other-card-meta { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .other-card-group { font-family:'Syne',sans-serif; font-weight:700; font-size:10px; color:var(--atn-teal-bright); letter-spacing:0.2em; }
  .other-card-status { font-family:'Mulish',sans-serif; font-weight:800; font-size:11px; color:var(--text); letter-spacing:0.04em; }
  .other-card.completed .other-card-status { color:var(--text-dim); }
  .other-card-teams { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .other-card .flag { width:28px; height:20px; }
  .other-card .code { font-size:16px; }
  .other-card .score { font-size:20px; }

  /* ===== LEADERBOARD ROWS ===== */
  .lb-list { display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; }
  .leaderboard.top .lb-list { overflow:hidden; }
  .lb-row {
    background:var(--bg-card); border-radius:11px; padding:14px 16px 12px;
    border-left:4px solid var(--atn-teal);
    display:grid; grid-template-columns:48px 1fr auto; grid-template-rows:auto auto;
    gap:2px 14px; align-items:center;
    min-height:0;
  }
  .leaderboard.top .lb-row { flex:0 0 auto; min-height:92px; }
  .leaderboard.shame .lb-row { flex:1; }
  .lb-row.gold { border-left-color:var(--gold); }
  .lb-row.silver { border-left-color:var(--silver); }
  .lb-row.bronze { border-left-color:var(--bronze); }
  .lb-rank { grid-row:1/3; font-family:'Syne',sans-serif; font-weight:800; font-size:42px; color:var(--text); text-align:center; line-height:1; }
  .lb-row.gold .lb-rank { color:var(--gold); }
  .lb-row.silver .lb-rank { color:var(--silver); }
  .lb-row.bronze .lb-rank { color:var(--bronze); }
  .lb-name { font-family:'Syne',sans-serif; font-weight:700; font-size:19px; color:var(--text); letter-spacing:0.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-points { grid-row:1/3; font-family:'Syne',sans-serif; font-weight:800; font-size:34px; color:var(--atn-teal-bright); text-align:right; line-height:1; }
  .lb-meta { display:flex; align-items:center; gap:8px; }
  .lb-pts-label { font-family:'Mulish',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.18em; color:var(--text-dim); text-transform:uppercase; }
  .lb-trend { font-family:'Mulish',sans-serif; font-weight:800; font-size:11px; letter-spacing:0.04em; padding:2px 7px; border-radius:4px; }
  .lb-trend.up { color:var(--up); background:rgba(77,208,112,0.14); }
  .lb-trend.down { color:var(--down); background:rgba(255,107,107,0.14); }
  .lb-trend.same { color:var(--text-dimmer); }
  .lb-trend.new { color:var(--atn-teal-bright); background:rgba(0,212,179,0.14); }
  .lb-champ { font-family:'Mulish',sans-serif; font-weight:700; font-size:10px; letter-spacing:0.1em; color:var(--text-dim); }
  .lb-footer { padding-top:10px; margin-top:10px; border-top:1px solid var(--border); font-family:'Mulish',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.2em; color:var(--text-dimmer); text-transform:uppercase; text-align:center; flex-shrink:0; }

  /* ===== PHONE / NARROW VIEWPORT ===== */
  @media (max-width: 1023px), (orientation: portrait) and (max-width: 1366px) {
    html, body { overflow-y:auto; height:auto; }
    .viewport { position:static; overflow:visible; height:auto; min-height:100vh; inset:auto; }
    .stage {
      position:static !important; width:100% !important; height:auto !important;
      max-width:100%; transform:none !important;
      padding:18px 14px 24px; display:block;
    }
    .stage::before, .stage::after { display:none; }

    header { flex-direction:column; align-items:flex-start; gap:12px; padding-bottom:14px; }
    .title-block { text-align:left; }
    .atn-mark { font-size:30px; }
    .title { font-size:38px; }
    .subtitle { font-size:12px; margin-top:6px; }
    .section-label { font-size:11px; }

    .body-grid {
      display:flex; flex-direction:column; gap:14px; margin-top:16px;
    }
    .today-panel, .leaderboard { padding:16px 14px 12px; }
    .panel-title, .lb-title { font-size:17px; letter-spacing:0.16em; }
    .panel-subtitle, .lb-subtitle { font-size:10px; }

    /* On mobile, top panel expands naturally — no auto-scroll */
    .leaderboard.top .lb-list { overflow:visible; }
    .leaderboard.top .lb-row { min-height:auto; }
    .lb-row { padding:12px 14px 10px; }
    .lb-rank { font-size:34px; }
    .lb-name { font-size:17px; }
    .lb-points { font-size:28px; }
    .lb-pts-label { font-size:9px; }

    /* Today match cards — slimmer for narrow screens */
    .tmatch { padding:12px 14px; flex:0 0 auto; }
    .tflag { width:32px; height:22px; }
    .tcode { font-size:22px; }
    .tscore { font-size:24px; }
    .tvs { font-size:12px; }
    .tmatch-group { font-size:11px; }
    .tmatch-status { font-size:12px; }

    footer { flex-direction:column; gap:6px; align-items:flex-start; padding-top:12px; margin-top:14px; }
    .footer-tag, .footer-meta { font-size:10px; letter-spacing:0.18em; }
  }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage">
    <header>
      <div class="branding">
        <span class="atn-mark">ATN</span>
        <div class="divider"></div>
        <span class="section-label" id="section-label">Break Room Display</span>
      </div>
      <div class="title-block">
        <div class="title" id="title">FIFA <span class="accent">2026</span></div>
        <div class="subtitle" id="subtitle">&nbsp;</div>
      </div>
    </header>

    <div class="body-grid">
      <section class="today-panel">
        <div class="panel-header">
          <div class="panel-title" id="today-title">Today</div>
          <div class="panel-subtitle" id="today-date">&nbsp;</div>
        </div>
        <div class="today-list" id="today-list"></div>
      </section>
      <aside class="leaderboard top">
        <div class="lb-header">
          <div class="lb-title">Pool · Standings</div>
          <div class="lb-subtitle" id="lb-count">&nbsp;</div>
        </div>
        <div class="lb-list" id="lb-list"></div>
        <div class="lb-footer">Updates as matches complete</div>
      </aside>
      <aside class="leaderboard shame">
        <div class="lb-header">
          <div class="lb-title">Shame Zone · Last 5</div>
          <div class="lb-subtitle">Bottom of pool</div>
        </div>
        <div class="lb-list" id="shame-list"></div>
        <div class="lb-footer">Hang in there</div>
      </aside>
    </div>

    <footer>
      <div class="footer-tag" id="footer-tag">FIFA World Cup 26™</div>
      <div class="footer-meta">All Times Eastern · Live data via ESPN</div>
    </footer>
  </div>
</div>

<script>
/* =========================================================
   STATIC DATA
   ========================================================= */
const T = {
  MEX:['Mexico','mx'], RSA:['South Africa','za'], KOR:['South Korea','kr'], CZE:['Czechia','cz'],
  CAN:['Canada','ca'], BIH:['Bosnia & Herz.','ba'], QAT:['Qatar','qa'], SUI:['Switzerland','ch'],
  BRA:['Brazil','br'], MAR:['Morocco','ma'], HAI:['Haiti','ht'], SCO:['Scotland','gb-sct'],
  USA:['USA','us'], PAR:['Paraguay','py'], AUS:['Australia','au'], TUR:['Turkiye','tr'],
  GER:['Germany','de'], CUW:['Curacao','cw'], CIV:['Ivory Coast','ci'], ECU:['Ecuador','ec'],
  NED:['Netherlands','nl'], JPN:['Japan','jp'], SWE:['Sweden','se'], TUN:['Tunisia','tn'],
  ESP:['Spain','es'], CPV:['Cape Verde','cv'], KSA:['Saudi Arabia','sa'], URU:['Uruguay','uy'],

// Scoring rules
const PTS_EXACT = 5;
const PTS_DRAW  = 3;
const PTS_WIN   = 2;
const PTS_CHAMP = 7;

/* =========================================================
   STATE / UTILITIES
   ========================================================= */
const params = new URLSearchParams(location.search);
const OVERRIDE_DATE = params.get('date');
const FORCE_MODE    = params.get('mode');

function nowDate() {
  if (OVERRIDE_DATE) return new Date(OVERRIDE_DATE + 'T12:00:00');
  return new Date();
}
function dateStr(d) {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtDay(d){ return d.toLocaleDateString('en-US',{weekday:'short'}).toUpperCase(); }
function fmtDate(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase(); }
function fmtTime12(t){ const [h,m]=t.split(':').map(Number); const hr=((h+11)%12)+1; return hr+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM'); }
function fmtTime12Short(t){ const [h,m]=t.split(':').map(Number); const hr=((h+11)%12)+1; const ap=h<12?'AM':'PM'; return m===0?(hr+' '+ap):(hr+':'+String(m).padStart(2,'0')+' '+ap); }
function shortName(full){
  const parts=full.trim().split(/\s+/);
  if (parts.length<=1) return parts[0];
  return parts[0]+' '+parts[parts.length-1].charAt(0)+'.';
}
function roundLabel(m){
  if (m.round==='GROUP') return 'GROUP '+m.group;
  if (m.round==='R32') return 'ROUND OF 32';
  if (m.round==='R16') return 'ROUND OF 16';
  if (m.round==='QF') return 'QUARTERFINAL';
  if (m.round==='SF') return 'SEMIFINAL';
  if (m.round==='3RD') return '3RD PLACE';
  if (m.round==='FINAL') return 'FINAL';
  return m.group||'';
}

/* =========================================================
   ESPN
   ========================================================= */
const espnCache = new Map();

async function fetchScoreboard(d) {
  const key = dateStr(d).replace(/-/g,'');
  if (espnCache.has(key)) return espnCache.get(key);
  const url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates='+key;
  try {
    const r = await fetch(url, {cache:'no-store'});
    if (!r.ok) { espnCache.set(key,null); return null; }
    const j = await r.json();
    const events = (j && j.events) || [];
    espnCache.set(key, events);
    return events;
  } catch(e) {
    espnCache.set(key,null);
    return null;
  }
}

function teamToCode(team){
  if (!team) return null;
  const abbr=(team.abbreviation||'').toUpperCase();
  if (T[abbr]) return abbr;
  const name=(team.displayName||team.name||'').toLowerCase();
  for (const c in T) if (T[c][0].toLowerCase()===name) return c;
  for (const c in T) if (name.includes(T[c][0].toLowerCase())) return c;
  return null;
}

function findEspnEvent(events, match) {
  if (!events) return null;
  for (const ev of events) {
    const comp = ev.competitions && ev.competitions[0];
    if (!comp) continue;
    const teams = comp.competitors || [];
    if (teams.length !== 2) continue;
    const cA = teamToCode(teams[0].team);
    const cB = teamToCode(teams[1].team);
    if ([cA,cB].includes(match.aCode) && [cA,cB].includes(match.bCode)) {
      return {ev, comp, teams};
    }
  }
  return null;
}

function enrich(match, events) {
  const out = {...match};
  const found = findEspnEvent(events, match);
  if (!found) { out.espnStatus='unknown'; return out; }
  const {comp, teams} = found;
  const state = comp.status && comp.status.type && comp.status.type.state;
  out.espnStatus = state || 'unknown';
  const sA = teams.find(t => teamToCode(t.team) === match.aCode);
  const sB = teams.find(t => teamToCode(t.team) === match.bCode);
  if (sA) out.aScore = (sA.score!=null) ? parseInt(sA.score,10) : null;
  if (sB) out.bScore = (sB.score!=null) ? parseInt(sB.score,10) : null;
  if (state==='in') {
    out.live = true;
    const period = comp.status && comp.status.type && comp.status.type.shortDetail;
    const clock = comp.status && (comp.status.displayClock || '');
    out.statusText = period || clock || 'LIVE';
  } else if (state==='post') {
    out.completed = true;
    out.statusText = 'FT';
  } else {
    out.statusText = fmtTime12(match.time);
  }
  return out;
}

/* =========================================================
   SCORING
   ========================================================= */
function scoreMatch(predA, predB, actA, actB) {
  if (predA==null||predB==null||actA==null||actB==null) return 0;
  if (predA===actA && predB===actB) return PTS_EXACT;
  const predDraw = predA===predB, actDraw = actA===actB;
  if (predDraw && actDraw) return PTS_DRAW;
  if (predDraw !== actDraw) return 0;
  const predWinA = predA>predB, actWinA = actA>actB;
  return (predWinA===actWinA) ? PTS_WIN : 0;
}

// Build {matchNum -> [scoreA, scoreB]} from ESPN cache.
// includeLive: if true, include in-progress scores; else only completed.
// uptoDate: if set (YYYY-MM-DD), only matches with date <= uptoDate.
function buildMatchScores(includeLive, uptoDate) {
  const out = {};
  for (const m of MATCHES) {
    if (m.placeholder) continue;
    if (m.n > 72) continue; // only group stage scoreable so far
    if (uptoDate !== null && m.date > uptoDate) continue;
    const key = m.date.replace(/-/g,'');
    const events = espnCache.get(key);
    if (!events) continue;
    const found = findEspnEvent(events, m);
    if (!found) continue;
    const state = found.comp.status && found.comp.status.type && found.comp.status.type.state;
    if (state !== 'post' && !(includeLive && state === 'in')) continue;
    const tA = found.teams.find(t => teamToCode(t.team) === m.aCode);
    const tB = found.teams.find(t => teamToCode(t.team) === m.bCode);
    if (!tA || !tB || tA.score==null || tB.score==null) continue;
    out[m.n] = [parseInt(tA.score,10), parseInt(tB.score,10)];
  }
  return out;
}

function computeRanking(matchScores) {
  return PARTICIPANTS.map(arr => {
    const name = arr[0], champion = arr[1];
    let points = 0, exact = 0, draws = 0, winners = 0;
    for (let i = 1; i <= 72; i++) {
      const predA = arr[2 + (i-1)*2];
      const predB = arr[2 + (i-1)*2 + 1];
      const actual = matchScores[i];
      if (!actual || predA==null || predB==null) continue;
      const pts = scoreMatch(predA, predB, actual[0], actual[1]);
      if (pts===PTS_EXACT) exact++;
      else if (pts===PTS_DRAW) draws++;
      else if (pts===PTS_WIN) winners++;
      points += pts;
    }
    return { name, champion, points, exact, draws, winners };
  }).sort((a,b) => {
    if (b.points !== a.points) return b.points - a.points;
    return a.name.localeCompare(b.name);
  });
}

/* =========================================================
   QUERIES
   ========================================================= */
function matchesOn(date) {
  const ds = dateStr(date);
  return MATCHES.filter(m => m.date === ds).sort((a,b)=>a.time.localeCompare(b.time));
}
function matchesInRange(start, days) {
  const out = [];
  for (let i=0; i<days; i++) {
    const d = addDays(start, i);
    out.push({date:d, matches:matchesOn(d)});
  }
  return out;
}

/* =========================================================
   RENDER: WEEK & DAY
   ========================================================= */
function renderWeekView(now, enrichedByDate) {
  const today = dateStr(now);
  const days = matchesInRange(now, 3);
  let html = '<div class="days">';
  for (const {date, matches} of days) {
    const ds = dateStr(date);
    const isToday = ds === today;
    const eMatches = matches.map(m => enrichedByDate[ds] ? enrich(m, enrichedByDate[ds]) : m);
    html += '<div class="day'+(isToday?' today':'')+'">'
         + '<div class="day-header"><div class="day-name">'+fmtDay(date)+'</div><div class="day-date">'+fmtDate(date)+'</div></div>';
    if (eMatches.length === 0) {
      html += '<div class="day-empty">No matches</div>';
    } else {
      html += '<div class="matches">';
      for (const m of eMatches) html += renderMatchCard(m);
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderMatchCard(m) {
  const cls = m.live ? ' live' : (m.completed ? ' completed' : '');
  const showScore = (m.aScore != null && m.bScore != null);
  let statusHtml;
  if (m.live) statusHtml = '<span class="live-dot"></span>'+(m.statusText||'LIVE');
  else if (m.completed) statusHtml = 'FT';
  else statusHtml = fmtTime12Short(m.time);
  const teamA = m.placeholder
    ? '<span class="code placeholder">'+m.aName+'</span>'
    : '<img class="flag" src="https://flagcdn.com/w40/'+m.aFlag+'.png" alt=""><span class="code">'+m.aCode+'</span>';

    ? '<span class="code placeholder">'+m.bName+'</span>'
    : '<span class="code">'+m.bCode+'</span><img class="flag" src="https://flagcdn.com/w40/'+m.bFlag+'.png" alt="">';
  const middle = showScore ? '<span class="score">'+m.aScore+'–'+m.bScore+'</span>' : '<span class="vs">VS</span>';
  return '<div class="match'+cls+'">'
       + '<div class="match-meta"><span class="match-group">'+roundLabel(m)+'</span><span class="match-status">'+statusHtml+'</span></div>'
       + '<div class="match-teams"><div class="team">'+teamA+'</div>'+middle+'<div class="team right">'+teamB+'</div></div>'
       + '</div>';
}

function renderDayView(now, todays) {
  const live = todays.filter(m => m.live);
  const others = todays.filter(m => !m.live);

    if (a.completed && !b.completed) return 1;
    if (!a.completed && b.completed) return -1;
    return a.time.localeCompare(b.time);
  });
  const heroCount = Math.min(3, Math.max(1, live.length));

    const out = {};
    for (const n in currentScores) {
      const m = MATCHES.find(x => x.n === parseInt(n,10));
      if (!m) continue;
      if (m.date < today) out[n] = currentScores[n];
    }
    return out;
  })();
  const current = computeRanking(currentScores);
  const yesterday = computeRanking(yesterdayScores);
  const yesterdayIdx = {};
  yesterday.forEach((r,i) => { yesterdayIdx[r.name] = i; });
  const anyScored = Object.keys(currentScores).length > 0;
  const N = current.length;

  function rowHtml(r, displayRank, currentIdx, isShame) {
    const cls = !isShame && displayRank===1 ? 'gold'
              : !isShame && displayRank===2 ? 'silver'
              : !isShame && displayRank===3 ? 'bronze' : '';
    let trendHtml;
    if (!anyScored) {
      trendHtml = '<span class="lb-trend same">—</span>';
    } else {
      const yIdx = yesterdayIdx[r.name];
      if (yIdx === undefined) trendHtml = '<span class="lb-trend same">—</span>';
      else {
        const delta = yIdx - currentIdx;
        if (delta > 0) trendHtml = '<span class="lb-trend up">▲ '+delta+'</span>';
        else if (delta < 0) trendHtml = '<span class="lb-trend down">▼ '+Math.abs(delta)+'</span>';
        else trendHtml = '<span class="lb-trend same">—</span>';
      }
    }
    return '<div class="lb-row '+cls+'">'
         + '<div class="lb-rank">'+displayRank+'</div>'
         + '<div class="lb-name">'+shortName(r.name)+'</div>'
         + '<div class="lb-points">'+r.points+'</div>'
         + '<div class="lb-meta">'+trendHtml+'<span class="lb-pts-label">pts · '+(T[r.champion]?T[r.champion][0]:r.champion)+'</span></div>'
         + '</div>';
  }

  // Top: positions 1 through N-5 (everyone above the shame zone)
  let topHtml = '';
  const topLimit = Math.max(0, N - 5);
  for (let i=0; i<topLimit; i++) topHtml += rowHtml(current[i], i+1, i, false);
  document.getElementById('lb-list').innerHTML = topHtml;
  document.getElementById('lb-count').textContent = N + ' IN POOL';

  // Shame zone: bottom 5 in actual rank order
  let shameHtml = '';
  const start = Math.max(0, N - 5);
  for (let i=start; i<N; i++) shameHtml += rowHtml(current[i], i+1, i, true);
  document.getElementById('shame-list').innerHTML = shameHtml;
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
async function ensureESPNData() {
  const today = nowDate();
  espnCache.delete(dateStr(today).replace(/-/g,''));
  const start = new Date('2026-06-11T12:00:00');
  const end = addDays(today, 2);
  const tasks = [];
  let cur = new Date(start);
  while (cur <= end) {
    tasks.push(fetchScoreboard(new Date(cur)));
    cur = addDays(cur, 1);
  }
  await Promise.all(tasks);
}

async function update() {
  await ensureESPNData();
  const now = nowDate();
  const today = dateStr(now);
  const todaysStatic = matchesOn(now);
  const todaysEvents = espnCache.get(today.replace(/-/g,''));
  const todaysEnriched = todaysStatic.map(m => enrich(m, todaysEvents));
  const anyLive = todaysEnriched.some(m => m.live);

  // Header
  document.getElementById('section-label').textContent = anyLive ? 'Live Now' : 'Break Room Display';
  document.getElementById('title').innerHTML = 'FIFA <span class="accent">2026</span>';
  document.getElementById('subtitle').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  // Today panel header
  document.getElementById('today-title').textContent = anyLive ? 'Today · Live' : 'Today';
  document.getElementById('today-date').textContent = now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();

  // Render
  renderTodayPanel(now, todaysEnriched);
  renderRankings();
}
/* =========================================================
   SCALING + REFRESH
   ========================================================= */
const stage = document.querySelector('.stage');
function isMobileViewport() {
  return window.matchMedia('(max-width: 1023px), (orientation: portrait) and (max-width: 1366px)').matches;
}
function fit() {
  if (isMobileViewport()) {
    stage.style.transform = '';
    return;
  }
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  const s = Math.min(vw/1920, vh/1080) * 0.9;
  const offX = (vw - 1920*s)/2, offY = (vh - 1080*s)/2;
  stage.style.transform = 'translate('+offX+'px, '+offY+'px) scale('+s+')';
}
fit();
window.addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
setInterval(fit, 5000);

/* =========================================================
   AUTO-SCROLL: cycle the standings column on TV/desktop
   ========================================================= */
const SCROLL_CYCLE_MS = 32000;  // full down-and-back cycle
const SCROLL_PAUSE_MS = 4500;   // dwell at top and bottom
function autoScrollStep(now) {
  const el = document.getElementById('lb-list');
  if (el && !isMobileViewport()) {
    const max = el.scrollHeight - el.clientHeight;
    if (max > 0) {
      const t = now % SCROLL_CYCLE_MS;
      const halfScroll = (SCROLL_CYCLE_MS - 2*SCROLL_PAUSE_MS) / 2;
      let pos;
      if (t < SCROLL_PAUSE_MS) pos = 0;
      else if (t < SCROLL_PAUSE_MS + halfScroll) pos = max * (t - SCROLL_PAUSE_MS) / halfScroll;
      else if (t < SCROLL_PAUSE_MS + halfScroll + SCROLL_PAUSE_MS) pos = max;
      else pos = max * (1 - (t - 2*SCROLL_PAUSE_MS - halfScroll) / halfScroll);
      el.scrollTop = pos;
    } else {
      el.scrollTop = 0;
    }
  }
  requestAnimationFrame(autoScrollStep);
}
requestAnimationFrame(autoScrollStep);

// Initial render
update();
// Refresh every 30s
setInterval(update, 30000);
</script>
