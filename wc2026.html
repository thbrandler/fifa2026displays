<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATN &ndash; FIFA World Cup 2026 Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100vw;
    height: 100vh;
    background: #1a1a1a;
    overflow: hidden;
  }

  body {
    font-family: 'Mulish', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .pitch-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .pitch-bg svg {
    width: 100%;
    height: 100%;
    opacity: 0.045;
  }

  /* Fixed 1920x1080 stage scaled to fit viewport.
     All sizing is in px against this stage, so it scales uniformly. */
  .stage {
    position: relative;
    z-index: 2;
    width: 1920px;
    height: 1080px;
    transform-origin: center center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 80px;
  }

  /* TOP BANNER */
  .top-banner {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 36px;
  }

  .atn-badge {
    background: #009f88;
    color: #ffffff;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: 0.14em;
    padding: 16px 52px;
    border-radius: 12px;
    text-transform: uppercase;
  }

  .divider-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #444444;
  }

  .fifa-badge {
    background: #242424;
    border: 1px solid #333333;
    color: #888888;
    font-family: 'Mulish', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.12em;
    padding: 16px 52px;
    border-radius: 12px;
    text-transform: uppercase;
  }

  /* HEADLINE */
  .headline {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 130px;
    color: #f0f0f0;
    line-height: 1.05;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  .headline .accent {
    color: #009f88;
  }

  .subline {
    font-size: 30px;
    color: #666666;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 44px;
    font-weight: 600;
  }

  .subline .sep {
    color: #009f88;
    margin: 0 16px;
  }

  /* COUNTDOWN */
  .countdown-grid {
    display: flex;
    gap: 32px;
    justify-content: center;
    margin-bottom: 44px;
  }

  .unit-card {
    background: #242424;
    border: 1px solid #333333;
    border-radius: 20px;
    padding: 44px 56px 36px;
    min-width: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }

  .unit-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: #009f88;
  }

  .unit-number {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 150px;
    color: #f0f0f0;
    line-height: 1;
    min-width: 3ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .unit-label {
    font-size: 24px;
    color: #555555;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 700;
  }

  /* HOST CHIPS */
  .host-info {
    display: flex;
    gap: 28px;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .host-chip {
    display: flex;
    align-items: center;
    gap: 18px;
    background: #242424;
    border: 1px solid #333333;
    border-radius: 60px;
    padding: 14px 36px 14px 14px;
  }

  .host-chip img {
    width: 78px;
    height: 52px;
    border-radius: 6px;
    object-fit: cover;
    display: block;
    border: 1px solid #444444;
  }

  .host-chip strong {
    color: #f0f0f0;
    font-weight: 700;
    font-size: 30px;
  }

  /* KICKOFF */
  .kick-off {
    font-size: 26px;
    color: #555555;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    margin-bottom: 36px;
    font-weight: 600;
  }

  .kick-off .highlight {
    color: #009f88;
  }

  .kick-off .sep {
    margin: 0 14px;
  }

  /* BET STRIP */
  .bet-strip {
    background: #242424;
    border: 1px solid #333333;
    border-radius: 14px;
    padding: 26px 64px;
    font-size: 38px;
    color: #888888;
    display: flex;
    align-items: center;
    gap: 24px;
    font-weight: 600;
  }

  .bet-strip strong {
    color: #009f88;
    font-weight: 700;
  }

  .pulse-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #009f88;
    flex-shrink: 0;
    animation: pulse-anim 1.8s ease-in-out infinite;
  }

  @keyframes pulse-anim {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.65); }
  }
</style>
</head>
<body>

<div class="pitch-bg">
  <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <rect x="80" y="60" width="1760" height="960" fill="none" stroke="#009f88" stroke-width="4"/>
    <line x1="960" y1="60" x2="960" y2="1020" stroke="#009f88" stroke-width="4"/>
    <circle cx="960" cy="540" r="200" fill="none" stroke="#009f88" stroke-width="4"/>
    <circle cx="960" cy="540" r="8" fill="#009f88"/>
    <rect x="80" y="280" width="280" height="520" fill="none" stroke="#009f88" stroke-width="4"/>
    <rect x="1560" y="280" width="280" height="520" fill="none" stroke="#009f88" stroke-width="4"/>
    <rect x="80" y="380" width="110" height="320" fill="none" stroke="#009f88" stroke-width="3"/>
    <rect x="1730" y="380" width="110" height="320" fill="none" stroke="#009f88" stroke-width="3"/>
    <circle cx="80" cy="540" r="120" fill="none" stroke="#009f88" stroke-width="3"/>
    <circle cx="1840" cy="540" r="120" fill="none" stroke="#009f88" stroke-width="3"/>
  </svg>
</div>

<div class="stage" id="stage">

  <div class="top-banner">
    <div class="atn-badge">ATN</div>
    <div class="divider-dot"></div>
    <div class="fifa-badge">FIFA World Cup 2026</div>
  </div>

  <div class="headline">The World Cup <span class="accent">Countdown</span></div>
  <div class="subline">North America <span class="sep">&mdash;</span> June 11 <span class="sep">&middot;</span> 2026</div>

  <div class="countdown-grid">
    <div class="unit-card">
      <div class="unit-number" id="cd-days">--</div>
      <div class="unit-label">Days</div>
    </div>
    <div class="unit-card">
      <div class="unit-number" id="cd-hours">--</div>
      <div class="unit-label">Hours</div>
    </div>
    <div class="unit-card">
      <div class="unit-number" id="cd-mins">--</div>
      <div class="unit-label">Mins</div>
    </div>
    <div class="unit-card">
      <div class="unit-number" id="cd-secs">--</div>
      <div class="unit-label">Secs</div>
    </div>
  </div>

  <div class="host-info">
    <div class="host-chip">
      <img src="https://flagcdn.com/w80/us.png" alt="USA flag">
      <strong>USA</strong>
    </div>
    <div class="host-chip">
      <img src="https://flagcdn.com/w80/ca.png" alt="Canada flag">
      <strong>Canada</strong>
    </div>
    <div class="host-chip">
      <img src="https://flagcdn.com/w80/mx.png" alt="Mexico flag">
      <strong>Mexico</strong>
    </div>
  </div>

  <div class="kick-off">
    Opening Match <span class="sep">&middot;</span> <span class="highlight">June 11 &mdash; Mexico City</span>
  </div>

  <div class="bet-strip">
    <div class="pulse-dot"></div>
    <span>Internal prediction pool active &nbsp;&middot;&nbsp; <strong>Place your bets!</strong></span>
  </div>

</div>

<script>
  /* Scale the fixed 1920x1080 stage to fit any viewport while keeping aspect ratio.
     0.9 leaves ~5% breathing room on every side. */
  function fitStage() {
    var stage = document.getElementById('stage');
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080) * 0.9;
    stage.style.transform = 'scale(' + scale + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  function updateCountdown() {
    var target = new Date('2026-06-11T20:00:00-06:00');
    var now = new Date();
    var diff = target - now;
    if (diff <= 0) {
      ['cd-days','cd-hours','cd-mins','cd-secs'].forEach(function(id) {
        document.getElementById(id).textContent = '00';
      });
      return;
    }
    var days  = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins  = Math.floor((diff % 3600000) / 60000);
    var secs  = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent  = String(days).padStart(2,'0');
    document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent  = String(secs).padStart(2,'0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
