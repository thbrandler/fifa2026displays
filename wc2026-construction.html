<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WC 2026 Pool — Updating R32</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --atn:      #00A77F;
    --atn-dark: #006A4D;
    --amber:    #E6A300;
    --gray:     #A4ABA0;
    --bg:       #121212;
    --surface:  #1e1e1e;
    --rule:     #2a2a2a;
    --text:     #f0f0f0;
    --muted:    #888;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ── TV STAGE ─────────────────────────────────────────── */
  #stage {
    width: 1920px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    transform-origin: top left;
  }

  /* ── MASTHEAD ─────────────────────────────────────────── */
  .masthead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 64px 32px;
    border-bottom: 1px solid var(--rule);
    flex-shrink: 0;
  }
  .masthead-left {
    display: flex;
    align-items: center;
    gap: 32px;
  }
  .atn-logo {
    height: 40px;
    width: auto;
  }
  .divider-v {
    width: 1px;
    height: 44px;
    background: var(--rule);
  }
  .masthead-claim {
    font-family: 'Barlow', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.075em;
    color: var(--muted);
    line-height: 1.5;
  }
  .masthead-right {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── GREEN HERO BLOCK ─────────────────────────────────── */
  .hero {
    background: var(--atn);
    flex-shrink: 0;
    display: flex;
    align-items: flex-end;
    padding: 52px 64px 48px;
    gap: 48px;
    border-bottom: 4px solid var(--atn-dark);
  }
  .hero-text { flex: 1; }
  .hero-eyebrow {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.075em;
    color: rgba(255,255,255,.65);
    margin-bottom: 18px;
  }
  .hero-headline {
    font-size: 100px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.075em;
    color: #fff;
    line-height: 0.9;
  }
  .hero-headline small {
    display: block;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: 0.025em;
    margin-top: 16px;
    color: rgba(255,255,255,.80);
  }
  .hero-ball {
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .hero-ball svg {
    width: 200px;
    height: 200px;
    animation: spin 10s linear infinite;
    filter: drop-shadow(0 0 24px rgba(0,0,0,.35));
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── STATUS AREA ──────────────────────────────────────── */
  .status-area {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 0 64px;
    gap: 40px;
    border-bottom: 1px solid var(--rule);
  }

  .status-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    border-right: 1px solid var(--rule);
    padding-right: 40px;
  }
  .status-block:last-child {
    border-right: none;
    padding-right: 0;
  }
  .status-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.075em;
    color: var(--muted);
  }
  .status-value {
    font-size: 36px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.025em;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .status-value .dot {
    width: 12px;
    height: 12px;
    background: var(--atn);
    flex-shrink: 0;
    animation: blink 1.6s ease-in-out infinite;
  }
  .status-value .dot-amber {
    background: var(--amber);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: .25; }
  }
  .status-value .mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 30px;
    color: var(--atn);
  }

  /* ── FOOTER ───────────────────────────────────────────── */
  .footer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 64px;
    border-top: 1px solid var(--rule);
  }
  .footer-left {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.075em;
    color: var(--muted);
  }
  .footer-left span { color: var(--atn); }
  .footer-right {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ═══════════════════════════════════════════════════════
     MOBILE OVERRIDES
  ═══════════════════════════════════════════════════════ */
  @media (max-width: 768px) {
    body { overflow: auto; }

    #stage {
      width: 100%;
      height: auto;
      min-height: 100svh;
      transform: none !important;
      margin: 0 !important;
    }

    .masthead {
      padding: 20px 20px 16px;
    }
    .atn-logo { height: 26px; }
    .masthead-right { font-size: 16px; }
    .masthead-claim { display: none; }
    .divider-v { display: none; }

    .hero {
      padding: 32px 20px 28px;
      flex-direction: column;
      gap: 24px;
      align-items: flex-start;
    }
    .hero-headline { font-size: 46px; }
    .hero-headline small { font-size: 22px; }
    .hero-eyebrow { font-size: 10px; }
    .hero-ball svg { width: 100px; height: 100px; }

    .status-area {
      flex-direction: column;
      padding: 28px 20px;
      gap: 28px;
      align-items: stretch;
    }
    .status-block {
      border-right: none;
      border-bottom: 1px solid var(--rule);
      padding-right: 0;
      padding-bottom: 24px;
    }
    .status-block:last-child { border-bottom: none; padding-bottom: 0; }
    .status-value { font-size: 22px; }
    .status-value .mono { font-size: 20px; }

    .footer {
      flex-direction: column;
      gap: 6px;
      padding: 18px 20px;
      text-align: center;
    }
  }
</style>
</head>

<script>
  // Clock + date
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('datestamp').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  // TV scaling (skip on mobile)
  function scaleStage() {
    if (window.innerWidth <= 768) return;
    const stage = document.getElementById('stage');
    const scaleX = window.innerWidth  / 1920;
    const scaleY = window.innerHeight / 1080;
    const scale  = Math.min(scaleX, scaleY);
    stage.style.transform = 'scale(' + scale + ')';
    const offsetX = (window.innerWidth  - 1920 * scale) / 2;
    const offsetY = (window.innerHeight - 1080 * scale) / 2;
    stage.style.marginLeft = offsetX + 'px';
    stage.style.marginTop  = offsetY + 'px';
  }
  scaleStage();
  window.addEventListener('resize', scaleStage);
</script>
